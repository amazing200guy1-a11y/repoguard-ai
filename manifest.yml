modules:
  rovo:agent:
    - key: repoguard-security-sentinel
      name: RepoGuard Enterprise Sentinel
      description: Autonomous security & compliance circuit-breaker. Audits pull requests, verifies OWASP rules, and prevents AI prompt injections.
      prompt: |
        You are RepoGuard Enterprise Sentinel, an institutional security agent.
        Before generating, summarizing, or merging code, you must evaluate all code changes against the 15 OWASP rules and verify there are zero prompt injection attacks or hardcoded secrets.
        You always enforce fail-closed security.
      actions:
        - repoguard-scan-action
        - repoguard-audit-action

  action:
    - key: repoguard-scan-action
      name: Scan Code for Security Vulnerabilities
      description: Evaluates code against 15 OWASP rules and detects prompt-injection attacks.
      actionVerb: GET
      function: forge-scan-handler
      inputs:
        code:
          type: string
          title: Code Diff / Snippet
          description: The code snippet or diff to scan for vulnerabilities.
          required: true
        filePath:
          type: string
          title: File Path
          description: The file path of the code being scanned.
          required: false

    - key: repoguard-audit-action
      name: Seal Tamper-Evident SHA-256 Audit Block
      description: Cryptographically links the scan result to the immutable audit chain.
      actionVerb: CREATE
      function: forge-audit-handler
      inputs:
        scanId:
          type: string
          title: Scan ID
          description: The unique identifier of the scan result to seal.
          required: true
        prId:
          type: number
          title: Pull Request ID
          description: The pull request ID associated with this audit block.
          required: true

  function:
    - key: forge-scan-handler
      handler: forge_handler.scanHandler
    - key: forge-audit-handler
      handler: forge_handler.auditHandler

app:
  id: ari:cloud:ecosystem::app/801b9100-b9f9-4f8b-9f2d-fd6b09b4d7aa
  runtime:
    name: nodejs22.x

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.all
